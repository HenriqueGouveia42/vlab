services:
  db:             
    image: postgres:16-alpine
    container_name: vlab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vlab_solicitacoes
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - vlab_pgdata:/var/lib/postgresql/data
    networks:
      - vlab_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d vlab_solicitacoes"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server    
      dockerfile: Dockerfile
    container_name: vlab_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./server:/var/www/html
      - /var/www/html/vendor 
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vlab_network
    command: sh -c "if [ ! -f .env ]; then cp .env.example .env && php artisan key:generate; fi && composer install --no-interaction && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  client:
    build:
      context: ./client     
      dockerfile: Dockerfile
    container_name: vlab_client
    restart: unless-stopped
    ports:
      - "5173:5173"         
    volumes:
      - ./client:/app
      - /app/node_modules      
    depends_on:
      - api                 
    networks:
      - vlab_network
    # injeta a automação do .env antes de iniciar o servidor de desenvolvimento
    command: sh -c "if [ ! -f .env ]; then cp .env.example .env; fi && npm run dev"

networks:
  vlab_network:
    driver: bridge

volumes:
  vlab_pgdata:
    driver: local